name: pmos-build piash 

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git

      - name: Install pmbootstrap
        run: |
          pip3 install --upgrade pip
          pip3 install "git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git"

      - name: Prepare pmaports git metadata
        run: |
          git -C pmaports init
          git -C pmaports remote remove origin || true
          git -C pmaports remote add origin https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          git -C pmaports config user.email "ci@example.com"
          git -C pmaports config user.name "CI"
          git -C pmaports add .
          git -C pmaports commit -m "ci: snapshot pmaports" || true
          git -C pmaports branch -M master
          git -C pmaports update-ref refs/remotes/origin/master master

      - name: Initialize pmbootstrap
        env:
          PMBOOTSTRAP_WORK: ${{ github.workspace }}/workdir
        run: |
          mkdir -p "$PMBOOTSTRAP_WORK"
          yes "" | pmbootstrap \
            -p "${{ github.workspace }}/pmaports" \
            -w "$PMBOOTSTRAP_WORK" \
            init \
            --device nubia-nx669j \
            --channel edge

      - name: Build linux-nubia-nx669j
        env:
          PMBOOTSTRAP_WORK: ${{ github.workspace }}/workdir
        run: |
          pmbootstrap \
            -w "$PMBOOTSTRAP_WORK" \
            build linux-nubia-nx669j --force
